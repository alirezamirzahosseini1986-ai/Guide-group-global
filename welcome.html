<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide Group Global</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="welcome-body">

<div class="welcome-wrap">

  <div class="welcome-logo">
    <div class="welcome-g3">G³</div>
    <div class="welcome-brand-name">Guide Group Global</div>
  </div>

  <h1 class="welcome-headline">
    <span class="wl-fa">زبان خود را انتخاب کنید</span>
    <span class="wl-ar">اختر لغتك</span>
    <span class="wl-en">Choose your language</span>
  </h1>

  <div class="welcome-langs">
    <button class="welcome-lang-btn" data-lang="fa" onclick="chooseLang('fa')">
      <span class="wl-flag">🇮🇷</span>
      <span class="wl-name">فارسی</span>
    </button>
    <button class="welcome-lang-btn" data-lang="ar" onclick="chooseLang('ar')">
      <span class="wl-flag">🇸🇦</span>
      <span class="wl-name">العربية</span>
    </button>
    <button class="welcome-lang-btn" data-lang="en" onclick="chooseLang('en')">
      <span class="wl-flag">🇬🇧</span>
      <span class="wl-name">English</span>
    </button>
  </div>

</div>

<script>
function chooseLang(lang) {
  localStorage.setItem('ggg_lang', lang);
  window.location.href = 'index.html';
}
// If lang already set, skip welcome
if (localStorage.getItem('ggg_lang')) {
  window.location.replace('index.html');
}
</script>
</body>
</html>
